  <text x="834" y="68" font-family="'Segoe UI',system-ui,sans-serif" font-size="10" font-weight="700" fill="#475569" text-anchor="middle" letter-spacing="2">LIVE METRICS</text>
  <line x1="718" y1="78" x2="950" y2="78" stroke="#1E293B" stroke-width="1"/>

  <!-- Metric: P99 Latency -->
  <text x="718" y="102" font-family="'Segoe UI',system-ui,sans-serif" font-size="11" fill="#64748B">P99 Latency</text>
  <text x="736" y="120" font-family="'Segoe UI',system-ui,sans-serif" font-size="9" fill="#EF4444">3,420 ms</text>
  <text x="950" y="102" font-family="'Segoe UI',system-ui,sans-serif" font-size="14" font-weight="800" fill="#22C55E" text-anchor="end">840 ms</text>
  <rect x="718" y="124" width="222" height="3" rx="1.5" fill="#1E293B"/>
  <rect x="718" y="124" width="55" height="3" rx="1.5" fill="#22C55E"/>

  <!-- Metric: HTTP 500 -->
  <text x="718" y="150" font-family="'Segoe UI',system-ui,sans-serif" font-size="11" fill="#64748B">HTTP 500 Rate</text>
  <text x="736" y="168" font-family="'Segoe UI',system-ui,sans-serif" font-size="9" fill="#EF4444">&gt; 40%</text>
  <text x="950" y="150" font-family="'Segoe UI',system-ui,sans-serif" font-size="14" font-weight="800" fill="#22C55E" text-anchor="end">0%</text>
  <rect x="718" y="172" width="222" height="3" rx="1.5" fill="#1E293B"/>
  <rect x="718" y="172" width="2" height="3" rx="1.5" fill="#22C55E"/>

  <!-- Metric: HTTP 200 -->
  <text x="718" y="198" font-family="'Segoe UI',system-ui,sans-serif" font-size="11" fill="#64748B">HTTP 200 Rate</text>
  <text x="736" y="216" font-family="'Segoe UI',system-ui,sans-serif" font-size="9" fill="#EF4444">&lt; 60%</text>
  <text x="950" y="198" font-family="'Segoe UI',system-ui,sans-serif" font-size="14" font-weight="800" fill="#22C55E" text-anchor="end">100%</text>
  <rect x="718" y="220" width="222" height="3" rx="1.5" fill="#1E293B"/>
  <rect x="718" y="220" width="222" height="3" rx="1.5" fill="#22C55E"/>

  <!-- Metric: MTTR -->
  <text x="718" y="246" font-family="'Segoe UI',system-ui,sans-serif" font-size="11" fill="#64748B">MTTR</text>
  <text x="736" y="264" font-family="'Segoe UI',system-ui,sans-serif" font-size="9" fill="#EF4444">15–45 min</text>
  <text x="950" y="246" font-family="'Segoe UI',system-ui,sans-serif" font-size="14" font-weight="800" fill="#22C55E" text-anchor="end">&lt; 40 sec</text>
  <rect x="718" y="268" width="222" height="3" rx="1.5" fill="#1E293B"/>
  <rect x="718" y="268" width="12" height="3" rx="1.5" fill="#22C55E"/>

