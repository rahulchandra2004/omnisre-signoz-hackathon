<svg width="1000" height="420" viewBox="0 0 1000 420" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="60%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#130F22"/>
    </linearGradient>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1A2235"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1" fill="#1E293B"/>
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="18" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrowW" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <path d="M0,1 L0,6 L7,3.5 z" fill="#334155"/>
    </marker>
    <marker id="arrowG" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <path d="M0,1 L0,6 L7,3.5 z" fill="#22C55E"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1000" height="420" fill="url(#bg)"/>
  <rect width="1000" height="420" fill="url(#dots)" opacity="0.5"/>

  <!-- Ambient glows -->
  <circle cx="900" cy="60" r="180" fill="#F46800" opacity="0.05" filter="url(#softGlow)"/>
  <circle cx="120" cy="360" r="140" fill="#4285F4" opacity="0.06" filter="url(#softGlow)"/>

  <!-- Left accent bar -->
  <rect x="36" y="40" width="4" height="340" rx="2" fill="#F46800" opacity="0.9"/>

  <!-- ─────────────── TITLE BLOCK ─────────────── -->
  <text x="58" y="108" font-family="'Segoe UI',system-ui,-apple-system,sans-serif" font-size="78" font-weight="900" fill="white" letter-spacing="-3">Omni<tspan fill="#F46800" filter="url(#glow)">SRE</tspan></text>
  <text x="60" y="140" font-family="'Segoe UI',system-ui,-apple-system,sans-serif" font-size="16" font-weight="400" fill="#64748B" letter-spacing="0.3">Autonomous AI SRE Agent · Closed-Loop Self-Healing</text>

  <!-- Badge row -->
  <!-- MTTR badge -->
  <rect x="60" y="158" width="168" height="26" rx="13" fill="#15803D" opacity="0.25"/>
  <rect x="60" y="158" width="168" height="26" rx="13" fill="none" stroke="#22C55E" stroke-width="1"/>
  <circle cx="78" cy="171" r="4" fill="#22C55E"/>
  <text x="88" y="176" font-family="'Segoe UI',system-ui,sans-serif" font-size="11" font-weight="700" fill="#22C55E">MTTR &lt; 40 SECONDS</text>

  <!-- Hackathon badge -->
  <rect x="240" y="158" width="226" height="26" rx="13" fill="#92400E" opacity="0.25"/>
  <rect x="240" y="158" width="226" height="26" rx="13" fill="none" stroke="#F46800" stroke-width="1"/>
  <text x="353" y="176" font-family="'Segoe UI',system-ui,sans-serif" font-size="11" font-weight="600" fill="#F46800" text-anchor="middle">WeMakeDevs × Agents of SigNoz</text>

  <!-- ─────────────── PIPELINE ─────────────── -->
  <text x="60" y="220" font-family="'Segoe UI',system-ui,sans-serif" font-size="9.5" font-weight="700" fill="#334155" letter-spacing="2.5">AUTONOMOUS REMEDIATION PIPELINE</text>

  <!-- Box 1: SigNoz -->
  <rect x="60" y="232" width="136" height="62" rx="8" fill="url(#cardBg)" stroke="#F46800" stroke-width="1.5"/>
  <rect x="60" y="232" width="136" height="4" rx="2" fill="#F46800" opacity="0.5"/>
  <text x="128" y="256" font-family="'Segoe UI',system-ui,sans-serif" font-size="13" font-weight="700" fill="#F46800" text-anchor="middle">SigNoz Alert</text>
  <text x="128" y="272" font-family="'Segoe UI',system-ui,sans-serif" font-size="10" fill="#94A3B8" text-anchor="middle">p99 &gt; 2000ms</text>
  <text x="128" y="287" font-family="'Segoe UI',system-ui,sans-serif" font-size="9" fill="#475569" text-anchor="middle">Webhook fires</text>

  <!-- Arrow -->
  <line x1="196" y1="263" x2="218" y2="263" stroke="#334155" stroke-width="2" marker-end="url(#arrowW)"/>

  <!-- Box 2: Gemini -->
  <rect x="220" y="232" width="136" height="62" rx="8" fill="url(#cardBg)" stroke="#4285F4" stroke-width="1.5"/>
  <rect x="220" y="232" width="136" height="4" rx="2" fill="#4285F4" opacity="0.5"/>
  <text x="288" y="256" font-family="'Segoe UI',system-ui,sans-serif" font-size="13" font-weight="700" fill="#4285F4" text-anchor="middle">Gemini AI</text>
  <text x="288" y="272" font-family="'Segoe UI',system-ui,sans-serif" font-size="10" fill="#94A3B8" text-anchor="middle">Root-Cause Analysis</text>
  <text x="288" y="287" font-family="'Segoe UI',system-ui,sans-serif" font-size="9" fill="#475569" text-anchor="middle">ClickHouse logs</text>

  <!-- Arrow -->
  <line x1="356" y1="263" x2="378" y2="263" stroke="#334155" stroke-width="2" marker-end="url(#arrowW)"/>

  <!-- Box 3: Telegram -->
  <rect x="380" y="232" width="136" height="62" rx="8" fill="url(#cardBg)" stroke="#0088CC" stroke-width="1.5"/>
  <rect x="380" y="232" width="136" height="4" rx="2" fill="#0088CC" opacity="0.5"/>
  <text x="448" y="256" font-family="'Segoe UI',system-ui,sans-serif" font-size="13" font-weight="700" fill="#29B6F6" text-anchor="middle">Telegram HITL</text>
  <text x="448" y="272" font-family="'Segoe UI',system-ui,sans-serif" font-size="10" fill="#94A3B8" text-anchor="middle">Human approves</text>
  <text x="448" y="287" font-family="'Segoe UI',system-ui,sans-serif" font-size="9" fill="#475569" text-anchor="middle">Reply YES</text>

  <!-- Arrow (green = success path) -->
  <line x1="516" y1="263" x2="538" y2="263" stroke="#22C55E" stroke-width="2" marker-end="url(#arrowG)"/>

