  <rect x="540" y="232" width="136" height="62" rx="8" fill="url(#cardBg)" stroke="#22C55E" stroke-width="1.5"/>
  <rect x="540" y="232" width="136" height="4" rx="2" fill="#22C55E" opacity="0.5"/>
  <text x="608" y="256" font-family="'Segoe UI',system-ui,sans-serif" font-size="13" font-weight="700" fill="#22C55E" text-anchor="middle">Self-Heal</text>
  <text x="608" y="272" font-family="'Segoe UI',system-ui,sans-serif" font-size="10" fill="#94A3B8" text-anchor="middle">Docker restart</text>
  <text x="608" y="287" font-family="'Segoe UI',system-ui,sans-serif" font-size="9" fill="#22C55E" text-anchor="middle">In &lt; 40 seconds</text>

