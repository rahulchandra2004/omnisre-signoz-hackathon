  <line x1="44" y1="356" x2="676" y2="356" stroke="#1E293B" stroke-width="1"/>
  <text x="60" y="375" font-family="'Segoe UI',system-ui,sans-serif" font-size="10" fill="#334155">github.com/rahulchandra2004/omnisre-signoz-hackathon</text>
  <text x="60" y="394" font-family="'Segoe UI',system-ui,sans-serif" font-size="10" fill="#334155">Rahul Chandra Padamuttam · Track 01: AI &amp; Agent Observability</text>
