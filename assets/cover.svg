  <text x="746" y="321" font-family="'Segoe UI',system-ui,sans-serif" font-size="13" font-weight="700" fill="#22C55E">SYSTEM HEALED</text>
  <text x="730" y="345" font-family="'Segoe UI',system-ui,sans-serif" font-size="10" fill="#334155">No wake-up required</text>
  <text x="730" y="362" font-family="'Segoe UI',system-ui,sans-serif" font-size="10" fill="#334155">Zero human escalation</text>

