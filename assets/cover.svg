  <text x="60" y="322" font-family="'Segoe UI',system-ui,sans-serif" font-size="10" fill="#334155">Stack</text>

  <rect x="100" y="308" width="72" height="22" rx="5" fill="#F46800" opacity="0.12"/>
  <rect x="100" y="308" width="72" height="22" rx="5" fill="none" stroke="#F46800" stroke-width="0.75" opacity="0.6"/>
  <text x="136" y="323" font-family="'Segoe UI',system-ui,sans-serif" font-size="10" font-weight="600" fill="#F46800" text-anchor="middle">SigNoz</text>

  <rect x="182" y="308" width="86" height="22" rx="5" fill="#4285F4" opacity="0.12"/>
  <rect x="182" y="308" width="86" height="22" rx="5" fill="none" stroke="#4285F4" stroke-width="0.75" opacity="0.6"/>
  <text x="225" y="323" font-family="'Segoe UI',system-ui,sans-serif" font-size="10" font-weight="600" fill="#4285F4" text-anchor="middle">Gemini AI</text>

  <rect x="278" y="308" width="82" height="22" rx="5" fill="#0088CC" opacity="0.12"/>
  <rect x="278" y="308" width="82" height="22" rx="5" fill="none" stroke="#0088CC" stroke-width="0.75" opacity="0.6"/>
  <text x="319" y="323" font-family="'Segoe UI',system-ui,sans-serif" font-size="10" font-weight="600" fill="#29B6F6" text-anchor="middle">Telegram</text>

  <rect x="370" y="308" width="118" height="22" rx="5" fill="#2496ED" opacity="0.12"/>
  <rect x="370" y="308" width="118" height="22" rx="5" fill="none" stroke="#2496ED" stroke-width="0.75" opacity="0.6"/>
  <text x="429" y="323" font-family="'Segoe UI',system-ui,sans-serif" font-size="10" font-weight="600" fill="#38BDF8" text-anchor="middle">OpenTelemetry</text>

  <rect x="498" y="308" width="68" height="22" rx="5" fill="#7C3AED" opacity="0.12"/>
  <rect x="498" y="308" width="68" height="22" rx="5" fill="none" stroke="#7C3AED" stroke-width="0.75" opacity="0.6"/>
  <text x="532" y="323" font-family="'Segoe UI',system-ui,sans-serif" font-size="10" font-weight="600" fill="#A78BFA" text-anchor="middle">Docker</text>

